version: "3.8"
services:
  # Database
  postgres:
    container_name: BIPdb
    image: postgres:16.4
    env_file:
      - /app/exe_dumper/.env-database
    volumes:
      - database_dbdata:/app/database/data/postgres
    ports:
      - "5432:5432"
    restart: always
  
  # Main app
  exe_dumper:
    container_name: exe_dump
    image: exe_dumper:2.1
    ports:
      - "80:5000"
    restart: always
    volumes:
      - exe_dumper_files:/app/files

  # Evil twin
  evil_dumper:
    container_name: evil_dump
    image: evil_dumper:1.1
    ports:
      - "8080:5000"
    restart: always

  # Танец с бубном для настройки сертификата
  nginx_proxy:
    image: nginx:latest
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"
    depends_on:
      - exe_dumper

volumes:
  database_dbdata:
    external: true
  exe_dumper_files:
